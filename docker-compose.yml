services:
  postgres:
    image: postgres:16-alpine
    container_name: supermarket_postgres
    restart: always
    environment:
      POSTGRES_DB: supermarket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema-postgres.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
