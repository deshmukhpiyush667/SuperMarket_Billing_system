spring.application.name=Supermarket-Billing-System
server.port=8080

# Primary PostgreSQL Configuration (Can be overridden with environment variables)
# If PostgreSQL is not active, run with --spring.profiles.active=dev (H2 mode)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supermarket_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=SuperMarketBillingSystemSecretKeyMustBeAtLeast32BytesLongForHS256Security
app.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging
logging.level.com.supermarket.billing=INFO
logging.level.org.springframework.security=WARN
